name: CI do App

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  validacao:
    name: Typecheck e Testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_eas_json: ${{ steps.check_eas.outputs.exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos (TypeScript)
        run: npx tsc --noEmit

      - name: Executar testes
        run: npm test

      - name: Verificar presença do eas.json
        id: check_eas
        run: |
          if [ -f "eas.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  eas-preview:
    name: Build Preview EAS
    runs-on: ubuntu-latest
    needs: validacao
    if: needs.validacao.outputs.has_eas_json == 'true'
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar secret EXPO_TOKEN
        id: check_token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "EXPO_TOKEN não configurado; build preview EAS pulado."
          fi

      - name: Setup Node.js
        if: steps.check_token.outputs.has_token == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Expo / EAS
        if: steps.check_token.outputs.has_token == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Instalar dependências
        if: steps.check_token.outputs.has_token == 'true'
        run: npm ci

      - name: Disparar build preview Android (EAS)
        if: steps.check_token.outputs.has_token == 'true'
        run: eas build --platform android --profile preview --non-interactive --no-wait
